<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>itel Power Go Ad</title>
<style>
  @font-face { font-family: 'Anton'; src: url(fonts/anton.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: 'Montserrat'; src: url(fonts/montserrat.woff2) format('woff2'); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; background: #000; height: 100%; }
  body { display: grid; place-items: center; }
  canvas { height: 100vh; max-width: 100vw; aspect-ratio: 9 / 16; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
<script>
// 20 s vertical (9:16) motion ad. Everything is a pure function of time t,
// so the same code drives the live preview and the frame-exact video render.
// Music is 120 BPM: one beat = 0.5 s, and every cut lands on a beat.
const W = 1080, H = 1920, DUR = 20;
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');

const RED = '#E4002B', RED_DARK = '#7a0016', INK = '#08080c', VOLT = '#FFD400', WHITE = '#ffffff';

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = k => k === 1 ? 1 : 1 - Math.pow(2, -10 * k);
const eInExpo = k => k === 0 ? 0 : Math.pow(2, 10 * k - 10);
const eOutCubic = k => 1 - Math.pow(1 - k, 3);
const eInOutCubic = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const eOutElastic = k => k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI / 3)) + 1;
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const beatPulse = t => Math.exp(-((t % .5) * 9)); // 1 on every beat, decays fast

function font(size, fam = 'Anton', weight = 400) { ctx.font = `${weight} ${size}px ${fam}`; }
function fitText(txt, maxW, size, fam = 'Anton', weight = 400) {
  font(size, fam, weight);
  const w = ctx.measureText(txt).width;
  if (w > maxW) { size *= maxW / w; font(size, fam, weight); }
  return size;
}
function textC(txt, x, y, color) { ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, x, y); }
// RGB split glitch text
function glitchText(txt, x, y, color, amt) {
  if (amt > 0.01) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    textC(txt, x - amt, y, 'rgba(255,0,60,.8)');
    textC(txt, x + amt, y + amt * .3, 'rgba(0,220,255,.7)');
    ctx.restore();
  }
  textC(txt, x, y, color);
}

// ---------- props ----------
function boltPath(s) {
  ctx.beginPath();
  ctx.moveTo(10 * s, -60 * s); ctx.lineTo(-34 * s, 8 * s); ctx.lineTo(-4 * s, 8 * s);
  ctx.lineTo(-12 * s, 60 * s); ctx.lineTo(34 * s, -10 * s); ctx.lineTo(4 * s, -10 * s); ctx.closePath();
}

// itel logo, redrawn from the carton / device print: tilted red speech-bubble oval,
// white lowercase "itel", blue accent dot top-right. w = bubble width in px.
function drawItelLogo(g, cx, cy, w, o = {}) {
  const s = w / 1;
  g.save(); g.translate(cx, cy);
  if (o.dot) {
    g.save(); g.translate(.42 * s, -.33 * s); g.rotate(-.35);
    g.fillStyle = '#1f6fd1'; g.beginPath(); g.ellipse(0, 0, .1 * s, .072 * s, 0, 0, Math.PI * 2); g.fill(); g.restore();
  }
  g.save(); g.rotate(-.1);
  g.fillStyle = o.bubble || '#E4002B';
  g.beginPath(); g.ellipse(0, 0, .5 * s, .3 * s, 0, 0, Math.PI * 2); g.fill();
  // tail, bottom-left
  g.beginPath(); g.moveTo(-.30 * s, .17 * s); g.quadraticCurveTo(-.3 * s, .33 * s, -.36 * s, .37 * s);
  g.quadraticCurveTo(-.18 * s, .34 * s, -.12 * s, .27 * s); g.closePath(); g.fill();
  g.restore();
  g.save(); g.transform(1, 0, -.07, 1, 0, 0);
  g.font = `800 ${.36 * s}px Montserrat`; g.letterSpacing = `${-.012 * s}px`;
  g.fillStyle = o.text || '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('itel', 0, .01 * s);
  g.restore();
  g.restore();
}
window.drawItelLogo = drawItelLogo;
// "itel Energy" lockup as printed top-left on the carton
function drawEnergyLockup(g, x, y, h) {
  const w = h * 1.6;
  drawItelLogo(g, x + w / 2, y, w);
  g.save(); g.font = `800 ${h * .62}px Montserrat`; g.fillStyle = '#E4002B'; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.transform(1, 0, -.12, 1, 0, 0); g.fillText('Energy', x + w * 1.06 + y * .12, y + h * .02); g.restore();
}

// 3D product (see product.js) composited into the 2D frame. Returns the port anchor.
function drawProduct(x, y, S, pose) {
  const r = window.Product.render(pose);
  ctx.drawImage(r.canvas, x - S / 2, y - S / 2, S, S);
  return [x - S / 2 + r.anchor[0] * S, y - S / 2 + r.anchor[1] * S];
}

// Whole-word landing: 0% scale and opacity -> 105% -> settles at 100%. No masks.
function popK(t, t0, dur = .55) {
  const k = prog(t, t0, t0 + dur);
  const s = k < .65 ? 1.05 * eOutCubic(k / .65) : lerp(1.05, 1, eInOutCubic((k - .65) / .35));
  return { s, a: eOutCubic(clamp(k / .45)), on: k > 0 };
}
function popDraw(t, t0, x, y, draw, dur) {
  const p = popK(t, t0, dur); if (!p.on) return;
  ctx.save(); ctx.globalAlpha *= p.a; ctx.translate(x, y); ctx.scale(Math.max(p.s, .001), Math.max(p.s, .001)); draw(); ctx.restore();
}

function drawPhone(x, y, s, rot, pct, pop) {
  const w = 380, h = 760;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 60;
  ctx.fillStyle = '#111116'; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 56); ctx.fill(); ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 6; ctx.stroke();
  ctx.fillStyle = '#050508'; ctx.beginPath(); ctx.roundRect(-w / 2 + 18, -h / 2 + 18, w - 36, h - 36, 40); ctx.fill();
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.roundRect(-40, -h / 2 + 34, 80, 18, 9); ctx.fill();
  // charge ring
  const R = 120, full = pct >= 100;
  ctx.lineWidth = 20; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.beginPath(); ctx.arc(0, -30, R, 0, Math.PI * 2); ctx.stroke();
  ctx.save(); ctx.shadowColor = VOLT; ctx.shadowBlur = 30 + pop * 60;
  ctx.strokeStyle = full ? VOLT : (pct < 20 ? RED : VOLT);
  ctx.beginPath(); ctx.arc(0, -30, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct / 100); ctx.stroke(); ctx.restore();
  const sc = 1 + pop * .35;
  ctx.save(); ctx.translate(0, -30); ctx.scale(sc, sc);
  font(92); textC(Math.round(pct) + '%', 0, 4, WHITE); ctx.restore();
  ctx.save(); ctx.translate(0, 190); ctx.fillStyle = VOLT; boltPath(.9); ctx.fill(); ctx.restore();
  font(30, 'Montserrat', 700); ctx.letterSpacing = '6px';
  textC(full ? 'FULLY CHARGED' : 'CHARGING', 3, 280, full ? VOLT : 'rgba(255,255,255,.6)'); ctx.letterSpacing = '0px';
  ctx.restore();
}

function bez(p0, p1, p2, p3, k) {
  const u = 1 - k;
  return [u * u * u * p0[0] + 3 * u * u * k * p1[0] + 3 * u * k * k * p2[0] + k * k * k * p3[0],
          u * u * u * p0[1] + 3 * u * u * k * p1[1] + 3 * u * k * k * p2[1] + k * k * k * p3[1]];
}

// precomputed particles & grain
const PARTS = (() => { const r = rng(7); return Array.from({ length: 90 }, () => ({ x: r() * W, y: r() * H, v: 80 + r() * 260, s: 1.5 + r() * 4, a: .2 + r() * .6, ph: r() * 6 })); })();
const GRAIN = (() => {
  const r = rng(99); return Array.from({ length: 6 }, () => {
    const c = document.createElement('canvas'); c.width = 360; c.height = 640;
    const g = c.getContext('2d'), id = g.createImageData(360, 640);
    for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    g.putImageData(id, 0, 0); return c;
  });
})();

function particles(t, color, dir = -1, speedMul = 1) {
  ctx.save(); ctx.fillStyle = color;
  for (const p of PARTS) {
    let y = (p.y + dir * p.v * speedMul * t) % H; if (y < 0) y += H;
    const x = p.x + Math.sin(t * 1.5 + p.ph) * 20;
    ctx.globalAlpha = p.a * (.6 + .4 * Math.sin(t * 6 + p.ph));
    ctx.beginPath(); ctx.arc(x, y, p.s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function perspectiveGrid(t, color, alpha) {
  ctx.save(); ctx.strokeStyle = color; ctx.globalAlpha = alpha; ctx.lineWidth = 2;
  const hy = 1150, vx = W / 2;
  for (let i = -12; i <= 12; i++) { ctx.beginPath(); ctx.moveTo(vx + i * 30, hy); ctx.lineTo(vx + i * 260, H + 50); ctx.stroke(); }
  for (let i = 0; i < 14; i++) {
    const k = ((i + t * 1.4) % 14) / 14, y = hy + Math.pow(k, 2.2) * (H - hy + 100);
    ctx.globalAlpha = alpha * k; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
}

function rays(cx, cy, t, color, n = 18, alpha = .06) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * .15); ctx.fillStyle = color; ctx.globalAlpha = alpha;
  for (let i = 0; i < n; i++) { ctx.rotate(Math.PI * 2 / n); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(2200, -90); ctx.lineTo(2200, 90); ctx.fill(); }
  ctx.restore();
}

// ---------- scenes ----------
// 0.0 – 2.0  : the problem. 1% battery, flatlining pulse.
function scene1(t) {
  ctx.fillStyle = '#050507'; ctx.fillRect(0, 0, W, H);
  const fade = eOutCubic(prog(t, 0, .35));
  ctx.globalAlpha = fade;
  // battery
  const bx = W / 2, by = 760, bw = 300, bh = 540;
  const jitter = t > 1.6 ? (Math.sin(t * 90) * 8) : 0;
  ctx.save(); ctx.translate(bx + jitter, by);
  ctx.strokeStyle = WHITE; ctx.lineWidth = 16; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.roundRect(-bw / 2, -bh / 2, bw, bh, 40); ctx.stroke();
  ctx.fillStyle = WHITE; ctx.beginPath(); ctx.roundRect(-55, -bh / 2 - 44, 110, 34, 10); ctx.fill();
  const blink = (Math.floor(t * 4) % 2 === 0) ? 1 : .25;
  ctx.save(); ctx.globalAlpha *= blink; ctx.shadowColor = RED; ctx.shadowBlur = 40; ctx.fillStyle = RED;
  ctx.beginPath(); ctx.roundRect(-bw / 2 + 24, bh / 2 - 24 - 26, bw - 48, 26, 8); ctx.fill(); ctx.restore();
  ctx.restore();
  // 1%
  const g = (Math.sin(t * 37) > .85 || t > 1.7) ? 10 + 14 * Math.random() : 0;
  font(300); glitchText('1%', W / 2 + jitter, 1270, WHITE, g);
  // LOW BATTERY typewriter
  const s = 'LOW BATTERY', n = Math.floor(clamp((t - .5) / .6) * s.length);
  font(46, 'Montserrat', 700); ctx.letterSpacing = '14px';
  textC(s.slice(0, n) + (n < s.length && Math.floor(t * 8) % 2 ? '_' : ''), W / 2 + 7, 1470, RED); ctx.letterSpacing = '0px';
  // ECG line flatlining
  ctx.save(); ctx.strokeStyle = RED; ctx.lineWidth = 6; ctx.shadowColor = RED; ctx.shadowBlur = 20;
  const head = clamp(t / 1.8) * W; ctx.beginPath();
  for (let x = 0; x <= head; x += 6) {
    const k = x / W, amp = k < .55 ? 1 : Math.max(0, 1 - (k - .55) * 5);
    const ph = (x % 270) / 270; let yy = 0;
    if (ph > .4 && ph < .46) yy = -130 * amp; else if (ph >= .46 && ph < .52) yy = 90 * amp; else if (ph > .6 && ph < .7) yy = -25 * amp;
    x === 0 ? ctx.moveTo(x, 1640 + yy) : ctx.lineTo(x, 1640 + yy);
  }
  ctx.stroke(); ctx.restore();
  ctx.globalAlpha = 1;
}

// 2.0 – 5.0 : kinetic type on every beat, then zoom-punch into the reveal.
const WORDS = [
  { t: 2.0, txt: 'LONG DAY?', bg: INK, fg: WHITE },
  { t: 2.5, txt: 'PHONE DYING?', bg: RED, fg: WHITE },
  { t: 3.0, txt: 'NO SOCKET', bg: WHITE, fg: INK },
  { t: 3.5, txt: 'IN SIGHT?', bg: INK, fg: RED },
  { t: 4.0, txt: 'NOT', bg: RED, fg: INK },
  { t: 4.5, txt: 'ANYMORE.', bg: INK, fg: WHITE },
];
function scene2(t) {
  let w = WORDS[0]; for (const x of WORDS) if (t >= x.t) w = x;
  const lt = t - w.t;
  ctx.fillStyle = w.bg; ctx.fillRect(0, 0, W, H);
  // speed lines
  ctx.save(); ctx.strokeStyle = w.fg; ctx.globalAlpha = .12 * Math.exp(-lt * 5); ctx.lineWidth = 4;
  const r = rng(Math.floor(t * 10) + 3);
  for (let i = 0; i < 40; i++) { const a = r() * Math.PI * 2, r0 = 300 + r() * 300; ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * r0, H / 2 + Math.sin(a) * r0); ctx.lineTo(W / 2 + Math.cos(a) * 2000, H / 2 + Math.sin(a) * 2000); ctx.stroke(); }
  ctx.restore();
  // slam
  let sc = lerp(1.7, 1, eOutExpo(clamp(lt / .16)));
  if (w.t === 4.5) sc *= 1 + 5 * eInExpo(prog(t, 4.62, 5.0)); // punch-in to white
  const rot = (WORDS.indexOf(w) % 2 ? 1 : -1) * .04 * (1 - eOutExpo(clamp(lt / .2)));
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(rot); ctx.scale(sc, sc);
  const size = fitText(w.txt, 960, w.txt.length <= 4 ? 520 : 300);
  const gl = lt < .08 ? 26 : 0;
  glitchText(w.txt, 0, 0, w.fg, gl);
  ctx.restore();
  // little counter bar at bottom: battery draining
  const drain = clamp(1 - (t - 2) / 2.5);
  ctx.fillStyle = w.fg; ctx.globalAlpha = .9;
  if (t < 4) { font(34, 'Montserrat', 700); ctx.letterSpacing = '8px'; textC('BATTERY ' + Math.max(1, Math.round(drain * 9)) + '%', W / 2 + 4, 1700, w.fg); ctx.letterSpacing = '0px'; }
  ctx.globalAlpha = 1;
  if (t >= 4.5) { ctx.save(); ctx.translate(W / 2, 1780); ctx.fillStyle = RED; ctx.scale(eOutBack(prog(t, 4.5, 4.7)), eOutBack(prog(t, 4.5, 4.7))); boltPath(1); ctx.fill(); ctx.restore(); }
  // flash to white into the reveal
  const f = eInExpo(prog(t, 4.7, 5.0));
  if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${f})`; ctx.fillRect(0, 0, W, H); }
}

// 5.0 – 9.0 : hero reveal of the real product (3D turntable).
function heroBg(t, cx, cy) {
  const pulse = beatPulse(t);
  const g = ctx.createRadialGradient(cx, cy, 50, cx, cy, 1300);
  g.addColorStop(0, `rgba(${170 + pulse * 60},0,30,1)`); g.addColorStop(.45, '#2a0008'); g.addColorStop(1, '#060608');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  rays(cx, cy, t, '#ff3355', 20, .05 + pulse * .03);
}
function scene3(t) {
  heroBg(t, W / 2, 780);
  perspectiveGrid(t, '#ff2d55', .35);
  for (const [t0, c] of [[5.0, WHITE], [5.12, RED], [7.0, '#ffffff']]) {
    const k = prog(t, t0, t0 + .9); if (k <= 0 || k >= 1) continue;
    ctx.save(); ctx.strokeStyle = c; ctx.globalAlpha = (1 - k) * (t0 === 7 ? .5 : 1); ctx.lineWidth = 40 * (1 - k) + 2;
    ctx.beginPath(); ctx.arc(W / 2, 780, eOutCubic(k) * 1400, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
  }
  particles(t, '#ffb3c0', -1, 1);
  // product rises and spins into its hero angle
  const k = prog(t, 5.0, 6.0);
  const y = lerp(2500, 760, eOutBack(k)) + Math.sin(t * 2.2) * 12;
  drawProduct(W / 2, y, 1300, {
    yaw: lerp(-3.4, -.42, eOutCubic(prog(t, 5.0, 6.3))) + Math.sin(t * .9) * .06,
    pitch: .16 + Math.sin(t * 1.3) * .02, roll: lerp(.25, 0, eOutCubic(k)),
    sweep: prog(t, 6.2, 7.0), rimColor: 0xff2448, rim: 3.2, floatGap: .25, shadow: .5, ledPulse: beatPulse(t),
  });
  // lockup lands as whole units: logo, then POWER GO, then tagline
  popDraw(t, 6.8, W / 2, 1360, () => drawItelLogo(ctx, 0, 0, 190, { dot: true }));
  popDraw(t, 7.0, W / 2, 1520, () => {
    ctx.save(); ctx.shadowColor = 'rgba(228,0,43,.9)'; ctx.shadowBlur = 40;
    fitText('POWER GO', 940, 170, 'Montserrat', 900); textC('POWER GO', 0, 0, WHITE); ctx.restore();
  });
  popDraw(t, 7.9, W / 2, 1650, () => { font(46, 'Montserrat', 500); textC('Power that moves with you.', 0, 0, 'rgba(255,255,255,.88)'); });
  const f = 1 - eOutCubic(prog(t, 5.0, 5.4));
  if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${f})`; ctx.fillRect(0, 0, W, H); }
}

// 9.0 – 13.0 : charge anywhere. Power Go -> cable -> phone fills to 100%.
const PLACES = ['ON THE BUS', 'ON CAMPUS', 'AT THE MARKET', 'ON THE ROAD', 'AT THE SHOP', 'DURING NEPA', 'AT WORK', 'ANYWHERE'];
function marquee(t, txt, y, dir, speed, alpha) {
  font(190); ctx.save(); ctx.strokeStyle = `rgba(255,255,255,${alpha})`; ctx.lineWidth = 3;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(txt).width; let x = ((dir * t * speed) % w); if (x > 0) x -= w;
  for (; x < W; x += w) ctx.strokeText(txt, x, y);
  ctx.restore();
}
function scene4(t) {
  ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0, 0, W, H);
  const row = PLACES.join('  •  ') + '  •  ';
  marquee(t, row, 700, -1, 260, .07); marquee(t, row, 1120, 1, 200, .05); marquee(t, row, 1560, -1, 300, .07);
  particles(t, VOLT, -1, .6);
  const h1 = eOutExpo(prog(t, 9.1, 9.4)), h2 = eOutExpo(prog(t, 9.35, 9.65));
  ctx.save(); ctx.translate(lerp(-700, 0, h1), 0); font(190); textC('CHARGE', W / 2, 220, WHITE); ctx.restore();
  ctx.save(); ctx.translate(lerp(900, 0, h2), 0); font(190); textC('ANYWHERE.', W / 2, 400, RED); ctx.restore();
  const idx = clamp(Math.floor((t - 9.5) / .5), 0, PLACES.length - 1);
  const lt = (t - 9.5) % .5, ck = eOutExpo(clamp(lt / .18));
  if (t > 9.5) {
    ctx.save(); ctx.translate(W / 2, 560);
    font(40, 'Montserrat', 700); ctx.letterSpacing = '8px';
    const pw = ctx.measureText(PLACES[idx]).width + 80, last = idx === PLACES.length - 1;
    ctx.fillStyle = last ? VOLT : 'rgba(255,255,255,.1)';
    ctx.beginPath(); ctx.roundRect(-pw / 2, -38, pw, 76, 38); ctx.fill();
    ctx.beginPath(); ctx.rect(-pw / 2, -38, pw, 76); ctx.clip();
    textC(PLACES[idx], 4, lerp(60, 2, ck), last ? INK : WHITE);
    ctx.letterSpacing = '0px'; ctx.restore();
  }
  const e1 = eOutBack(prog(t, 9.2, 9.8)), e2 = eOutBack(prog(t, 9.3, 9.9));
  const phone = { x: lerp(1500, 700, e2), y: 1060 + Math.sin(t * 2 + 1) * 8, s: .8, r: .07 };
  const bx = lerp(-500, 290, e1), by = 1440 + Math.sin(t * 2) * 8;
  // draw the product first to get its real port position for the cable
  const port = drawProduct(bx, by, 820, { yaw: .5, pitch: .32, sweep: prog(t, 10.2, 11.2), rimColor: 0xffd400, rim: 1.6, shadow: 0, ledPulse: t > 10 ? .5 + .5 * Math.sin(t * 12) : 0 });
  const bot = [phone.x - Math.sin(phone.r) * 380 * phone.s, phone.y + Math.cos(phone.r) * 380 * phone.s];
  const p1 = [port[0] - 40, port[1] - 260], p2 = [bot[0], bot[1] + 260];
  const ck2 = eInOutCubic(prog(t, 9.7, 10.1));
  if (ck2 > 0) {
    ctx.save(); ctx.lineCap = 'round';
    ctx.strokeStyle = '#1e1e24'; ctx.lineWidth = 16; ctx.beginPath();
    for (let i = 0; i <= 60 * ck2; i++) { const p = bez(port, p1, p2, bot, i / 60); i ? ctx.lineTo(...p) : ctx.moveTo(...p); } ctx.stroke();
    ctx.shadowColor = VOLT; ctx.shadowBlur = 25; ctx.strokeStyle = VOLT; ctx.lineWidth = 5; ctx.stroke();
    if (t > 10 && t < 12.2) for (let i = 0; i < 6; i++) {
      const k = ((t - 10) * 1.4 + i / 6) % 1, p = bez(port, p1, p2, bot, k);
      ctx.fillStyle = WHITE; ctx.beginPath(); ctx.arc(p[0], p[1], 11, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  const pct = lerp(1, 100, eInOutCubic(prog(t, 10.0, 12.0)));
  const pop = t >= 12 ? Math.exp(-(t - 12) * 5) : 0;
  drawPhone(phone.x, phone.y, phone.s, phone.r, pct, pop);
  if (t >= 12) {
    const k = prog(t, 12, 12.8);
    ctx.save(); ctx.strokeStyle = VOLT; ctx.globalAlpha = 1 - k; ctx.lineWidth = 8;
    const r = rng(5);
    for (let i = 0; i < 24; i++) {
      const a = i / 24 * Math.PI * 2 + r() * .2, r0 = 150 + eOutCubic(k) * 380, r1 = r0 + 60 * (1 - k);
      ctx.beginPath(); ctx.moveTo(phone.x + Math.cos(a) * r0, phone.y - 25 + Math.sin(a) * r0); ctx.lineTo(phone.x + Math.cos(a) * r1, phone.y - 25 + Math.sin(a) * r1); ctx.stroke();
    }
    ctx.restore();
  }
}

// 13.0 – 16.5 : white liquid-glass spec cards floating over the product.
const bgc = document.createElement('canvas'); bgc.width = W; bgc.height = H;
const bctx = bgc.getContext('2d');
function icon(kind, s) {
  ctx.save(); ctx.scale(s, s); ctx.strokeStyle = '#15151c'; ctx.lineWidth = 7; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (kind === 'battery') {
    ctx.beginPath(); ctx.roundRect(-52, -30, 96, 60, 10); ctx.stroke();
    ctx.fillStyle = '#15151c'; ctx.beginPath(); ctx.roundRect(46, -12, 10, 24, 3); ctx.fill();
    ctx.fillStyle = RED; for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.roundRect(-42 + i * 21, -20, 16, 40, 3); ctx.fill(); }
  } else if (kind === 'bolt') { ctx.fillStyle = RED; boltPath(.95); ctx.fill(); }
  else {
    ctx.beginPath(); ctx.roundRect(-48, -14, 96, 62, 16); ctx.stroke();
    ctx.strokeStyle = '#b8895f'; ctx.lineWidth = 12;
    ctx.beginPath(); ctx.moveTo(-40, -8); ctx.bezierCurveTo(-44, -70, 44, -70, 40, -8); ctx.stroke();
    ctx.fillStyle = RED; ctx.beginPath(); ctx.ellipse(0, 18, 14, 9, -.1, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
const FEATS = [
  { t: 13.2, n: '01', icon: 'battery', h: '100,000mAh', s: 'Massive capacity, ready when you are' },
  { t: 13.8, n: '02', icon: 'bolt', h: '130W OUTPUT', s: 'Serious power across multiple ports' },
  { t: 14.4, n: '03', icon: 'strap', h: 'CARRY STRAP', s: 'Grab it and go, anywhere' },
];
function glassBg(t, fade) {
  const main = ctx; ctx = bctx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#f1f0ee'; ctx.fillRect(0, 0, W, H);
  const blobs = [[RED, .55, 220 + Math.sin(t) * 120, 650, 520], ['#ff8fa3', .5, 900, 1350 + Math.cos(t * .8) * 120, 560],
                 ['#ffc9a0', .55, 260, 1650, 480], [RED, .35, 860 + Math.cos(t * 1.2) * 90, 380, 380]];
  for (const [c, a, x, y, r] of blobs) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c); g.addColorStop(1, 'rgba(241,240,238,0)');
    ctx.globalAlpha = a * fade; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.globalAlpha = 1;
  const k = eOutCubic(prog(t, 13.0, 13.8));
  drawProduct(W / 2, lerp(1250, 1120, k), 1650, { yaw: -.9 + (t - 13) * .35, pitch: .12, rimColor: 0xffffff, rim: 1.2, shadow: .9, exposure: 1.05 });
  ctx = main;
}
function glassPanel(x, y, w, h, r, flash) {
  // soft diffused drop shadow (shape drawn off-canvas, only its shadow lands here)
  ctx.save(); ctx.shadowColor = 'rgba(40,20,30,.22)'; ctx.shadowBlur = 70; ctx.shadowOffsetX = 5000; ctx.shadowOffsetY = 30;
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.roundRect(x - 5000, y, w, h, r); ctx.fill(); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.clip();
  // frosted, slightly magnified background = refraction through thick glass
  ctx.filter = 'blur(26px) saturate(1.5)';
  const cx = x + w / 2, cy = y + h / 2, m = 1.08;
  ctx.drawImage(bgc, cx - (cx) * m, cy - (cy) * m, W * m, H * m);
  ctx.filter = 'none';
  ctx.fillStyle = 'rgba(255,255,255,.26)'; ctx.fillRect(x, y, w, h);
  // liquid highlights: bright top edge, soft glow pooling at bottom
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(255,255,255,.6)'); g.addColorStop(.18, 'rgba(255,255,255,.06)');
  g.addColorStop(.8, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,.35)');
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  const sp = ctx.createRadialGradient(x + w * .18, y, 0, x + w * .18, y, w * .5);
  sp.addColorStop(0, 'rgba(255,255,255,.55)'); sp.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sp; ctx.fillRect(x, y, w, h);
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * .35})`; ctx.fillRect(x, y, w, h); }

  ctx.filter = 'blur(6px)'; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 14;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.stroke(); ctx.filter = 'none';
  ctx.restore();
  // fine inner stroke catching the light
  const st = ctx.createLinearGradient(x, y, x + w, y + h);
  st.addColorStop(0, 'rgba(255,255,255,.95)'); st.addColorStop(.5, 'rgba(255,255,255,.35)'); st.addColorStop(1, 'rgba(255,255,255,.8)');
  ctx.strokeStyle = st; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.roundRect(x + 1.5, y + 1.5, w - 3, h - 3, r - 1.5); ctx.stroke();
}
function scene5(t) {
  const fade = 1 - prog(t, 15.9, 16.4);
  glassBg(t, fade);
  ctx.drawImage(bgc, 0, 0);
  const out = eInExpo(prog(t, 15.85, 16.25));
  ctx.save(); ctx.globalAlpha = 1 - out;
  popDraw(t, 13.0, W / 2, 250, () => { font(140); textC('BUILT FOR', 0, 0, '#15151c'); }, .45);
  popDraw(t, 13.12, W / 2, 400, () => { font(140); textC('YOUR HUSTLE', 0, 0, RED); }, .45);
  ctx.restore();
  FEATS.forEach((f, i) => {
    const k = eOutExpo(prog(t, f.t, f.t + .4));
    if (k <= 0) return;
    const dir = i % 2 ? 1 : -1;
    const pw = 940, ph = 270, y = 640 + i * 350;
    const x = (W - pw) / 2 + dir * (1 - k) * 1300 - dir * out * 1500;
    const flash = t > f.t + .3 ? Math.exp(-(t - f.t - .3) * 6) : 0;
    glassPanel(x, y, pw, ph, 56, flash);
    ctx.save(); ctx.translate(x, y + ph / 2);
    // icon in an inner glass bubble
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(150, 0, 88, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.translate(150, 0); icon(f.icon, 1 + .12 * flash); ctx.restore();
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    font(28, 'Montserrat', 800); ctx.fillStyle = RED; ctx.fillText(f.n, 280, -52);
    fitText(f.h, 600, 90); ctx.fillStyle = '#15151c'; ctx.fillText(f.h, 280, 34);
    font(33, 'Montserrat', 600); ctx.fillStyle = 'rgba(21,21,28,.62)'; ctx.fillText(f.s, 280, 86);
    ctx.restore();
  });
  // carton-style red band rises into the end card
  const rb = eInOutCubic(prog(t, 16.0, 16.5));
  if (rb > 0) { ctx.fillStyle = RED; ctx.fillRect(-50, lerp(H + 60, BAND_Y, rb), W + 100, H); }
}

// 16.5 – 20.0 : end card modelled on the Power Go carton.
const BAND_Y = 1190;
function scene6(t) {
  const bg = ctx.createLinearGradient(0, 0, 0, BAND_Y);
  bg.addColorStop(0, '#ffffff'); bg.addColorStop(1, '#ecebea');
  ctx.fillStyle = bg; ctx.fillRect(-50, -50, W + 100, BAND_Y + 50);
  const soft = ctx.createRadialGradient(W / 2, 760, 0, W / 2, 760, 620);
  soft.addColorStop(0, 'rgba(255,255,255,1)'); soft.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = soft; ctx.fillRect(0, 0, W, BAND_Y);
  popDraw(t, 16.7, 0, 0, () => drawEnergyLockup(ctx, 70, 130, 88), .5);
  popDraw(t, 16.8, W - 70, 132, () => {
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    font(40, 'Montserrat', 800); ctx.fillStyle = RED; ctx.fillText('IESS-320T', 0, 0);
    font(26, 'Montserrat', 600); ctx.fillStyle = 'rgba(21,21,28,.6)'; ctx.fillText('Portable Power', 0, 40);
  }, .5);
  // product lands on the band edge
  const ks = eOutBack(prog(t, 16.5, 17.2));
  drawProduct(W / 2, 745 + (1 - ks) * 80, lerp(650, 1200, ks), {
    yaw: lerp(1.6, -.38, eOutCubic(prog(t, 16.5, 17.5))) + (t - 17.5) * .03, pitch: .1,
    rimColor: 0xff4060, rim: 1.4, shadow: 1, sweep: prog(t, 17.8, 18.8), exposure: 1.02,
  });
  // red band with darker diagonal streaks, like the box
  ctx.fillStyle = RED; ctx.fillRect(-50, BAND_Y, W + 100, H);
  ctx.save(); ctx.beginPath(); ctx.rect(-50, BAND_Y, W + 100, H); ctx.clip();
  ctx.globalAlpha = .18; ctx.strokeStyle = '#8a0019'; ctx.lineWidth = 3;
  for (let i = 0; i < 9; i++) { const o = i * 70 + (t * 40) % 70; ctx.beginPath(); ctx.moveTo(-100, BAND_Y + 420 + o * .3); ctx.bezierCurveTo(300, BAND_Y + 200 + o, 700, BAND_Y + 500 - o * .4, 1200, BAND_Y + 120 + o * .6); ctx.stroke(); }
  ctx.restore();
  const k0 = prog(t, 16.5, 17.3);
  if (k0 < 1) { ctx.save(); ctx.strokeStyle = WHITE; ctx.globalAlpha = (1 - k0) * .8; ctx.lineWidth = 24 * (1 - k0) + 2; ctx.beginPath(); ctx.arc(W / 2, 760, eOutCubic(k0) * 1300, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
  // POWER GO with the carton's outline echo; both land whole
  popDraw(t, 17.0, W / 2, 1300, () => {
    fitText('POWER GO', 900, 170, 'Montserrat', 900); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 2.5; ctx.strokeText('POWER GO', 0, 0);
  });
  popDraw(t, 17.12, W / 2, 1420, () => {
    ctx.save(); ctx.shadowColor = 'rgba(90,0,15,.35)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
    fitText('POWER GO', 900, 170, 'Montserrat', 900); textC('POWER GO', 0, 0, WHITE); ctx.restore();
  });
  popDraw(t, 17.6, W / 2, 1560, () => {
    font(44, 'Montserrat', 700); ctx.letterSpacing = '4px'; textC('100,000mAh   |   130W', 2, 0, WHITE); ctx.letterSpacing = '0px';
  });
  popDraw(t, 17.85, W / 2, 1635, () => { font(40, 'Montserrat', 500); textC('Stay charged. Keep moving.', 0, 0, 'rgba(255,255,255,.9)'); });
  const kc = eOutElastic(prog(t, 18.2, 19.1));
  const pulse = 1 + .04 * (t > 19.2 ? Math.exp(-(t - 19.2) * 4) : 0);
  if (kc > 0) {
    ctx.save(); ctx.translate(W / 2, 1770); ctx.scale(kc * pulse, kc * pulse);
    ctx.shadowColor = 'rgba(80,0,10,.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
    ctx.fillStyle = WHITE; ctx.beginPath(); ctx.roundRect(-270, -58, 540, 116, 58); ctx.fill(); ctx.shadowColor = 'transparent';
    font(42, 'Montserrat', 900); ctx.letterSpacing = '8px'; textC('AVAILABLE NOW', 4, 2, RED); ctx.letterSpacing = '0px';
    ctx.restore();
  }
}

// ---------- compositing ----------
const IMPACTS = [[2, 10], [2.5, 10], [3, 10], [3.5, 10], [4, 14], [4.5, 10], [5, 34], [9, 18], [12, 16], [16.5, 26]];
function shake(t) {
  let x = 0, y = 0;
  for (const [t0, a] of IMPACTS) { const d = t - t0; if (d < 0 || d > .5) continue; const m = a * Math.exp(-d * 10); x += Math.sin(d * 90) * m; y += Math.cos(d * 70) * m; }
  return { x, y };
}
function wipe(t) {
  // 9.0: skewed red slash sweeps across, covering the cut
  const k = prog(t, 8.72, 9.28);
  if (k > 0 && k < 1) {
    const sk = 700, lead = lerp(-sk, W + sk * 2, eInOutCubic(Math.min(1, k * 2)));
    const trail = k < .5 ? -sk - 200 : lerp(-sk, W + sk, eInOutCubic((k - .5) * 2));
    ctx.fillStyle = RED; ctx.beginPath(); ctx.moveTo(trail, 0); ctx.lineTo(lead, 0); ctx.lineTo(lead - sk, H); ctx.lineTo(trail - sk, H); ctx.fill();
    ctx.fillStyle = INK; ctx.beginPath(); ctx.moveTo(lead - 40, 0); ctx.lineTo(lead, 0); ctx.lineTo(lead - sk, H); ctx.lineTo(lead - sk - 40, H); ctx.fill();
  }
  // 13.0: shutter blinds close and open
  const a = prog(t, 12.78, 13.0), b = prog(t, 13.0, 13.25);
  const cover = t < 13 ? eInExpo(a) : 1 - eOutExpo(b);
  if (cover > 0 && t > 12.78 && t < 13.25) {
    ctx.fillStyle = '#f1f0ee'; const n = 10, bh = H / n;
    for (let i = 0; i < n; i++) ctx.fillRect(0, i * bh, W, bh * cover);
  }
}
let frame = 0;
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const s = shake(t);
  ctx.translate(s.x, s.y); ctx.scale(1.03, 1.03); ctx.translate(-W * .015, -H * .015);
  if (t < 2) scene1(t); else if (t < 5) scene2(t); else if (t < 9) scene3(t);
  else if (t < 13) scene4(t); else if (t < 16.5) scene5(t); else scene6(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  wipe(t);
  // film grain + vignette
  ctx.save(); ctx.globalAlpha = .07; ctx.globalCompositeOperation = 'overlay';
  ctx.drawImage(GRAIN[Math.floor(t * 30) % GRAIN.length], 0, 0, W, H); ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.5)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
window.render = render;
window.DUR = DUR;

// Live preview (skipped when ?render is in the URL: the renderer drives frames itself)
window.adReady = new Promise(res => window.addEventListener('product-ready', () => document.fonts.ready.then(res)));
if (!location.search.includes('render')) {
  const audio = new Audio('soundtrack.wav');
  let start = null;
  window.adReady.then(() => {
    render(0);
    cv.addEventListener('click', () => { start = performance.now(); audio.currentTime = 0; audio.play().catch(() => {}); });
    const loop = now => { if (start !== null) { const t = (now - start) / 1000; render(Math.min(t, DUR - 1e-3)); } requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  });
}
